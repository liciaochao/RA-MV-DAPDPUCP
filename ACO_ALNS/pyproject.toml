[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spd-planner"
version = "0.1.0"
description = "Interface-first skeleton for truck-drone SPD optimization."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.7", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]